[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "warmagent"
version = "0.1.0"
description = "Xiaowennuan with persistent memory, direct Harness tools and autonomous activities"
requires-python = ">=3.12,<3.13"
license-files = ["LICENSES/*"]
dependencies = [
  "aiohttp>=3.11.18,<4", "httpx>=0.28,<1", "igraph>=0.11,<2",
  "jsonschema>=4.23,<5", "leidenalg>=0.10,<1", "numpy>=2,<3",
  "pydantic>=2.10,<3", "scikit-learn>=1.5,<2", "scipy>=1.13,<1.16",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
neural = ["onnxruntime>=1.20,<2", "tokenizers>=0.21,<1"]
bili = ["bilibili-api-python>=17"]
documents = ["pypdf>=5,<7"]
native-build = ["ziglang==0.16.0"]

[project.scripts]
warmagent = "warmagent.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.15,<0.16"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/myatri", "src/warmagent"]
exclude = ["src/warmagent/_native/**"]
